
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colebourn Consulting — Coming Soon</title>
<meta name="description" content="Colebourn Consulting: power systems and operational technology consulting. Website under construction.">
<style>
  :root {
    --bg: #0b1220;
    --fg: #e8eef9;
    --muted: #8fa0bd;
    --accent: #f5b301;
    --line: #1c2a45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(circle at 80% 10%, rgba(245,179,1,.08), transparent 40%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 640px; }
  .bolt { width: 56px; height: 56px; margin-bottom: 1.5rem; }
  h1 {
    font-size: clamp(2rem, 6vw, 3.25rem);
    font-weight: 700;
    letter-spacing: .02em;
  }
  h1 span { color: var(--accent); }
  .tag {
    margin-top: .5rem;
    color: var(--muted);
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: .8rem;
  }
  .status {
    display: inline-block;
    margin: 2rem 0 1rem;
    padding: .5rem 1.1rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--accent);
    font-size: .85rem;
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  p.msg { color: var(--muted); line-height: 1.6; }
  footer { margin-top: 2.5rem; font-size: .8rem; color: var(--muted); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <svg class="bolt" viewBox="0 0 24 24" fill="none" stroke="#f5b301" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
      <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
    </svg>
    <h1>Colebourn <span>Consulting</span></h1>
    <div class="tag">Power Systems &bull; Operational Technology</div>
    <div class="status">Website under construction</div>
    <p class="msg">We're building something new. Our full site is coming soon.<br>
    In the meantime, please check back shortly.</p>
    <footer>
      <!-- Replace with your real contact email -->
      Enquiries: <a href="mailto:colebournconsulting@gmail.com">colebournconsulting@gmail.com</a><br><br>
      &copy; <script>document.write(new Date().getFullYear())</script> Colebourn Consulting
    </footer>
  </main>
</body>
</html>
