<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Colebourn Consulting</title>
  <meta name="description" content="Colebourn Consulting — Power Systems & Operational Technology.">
  <style>
    :root {
      --bg: #000000;
      --bg-deep: #01070b;
      --cyan: #27d7ff;
      --cyan-soft: #59e6ff;
      --ring: rgba(255, 255, 255, 0.18);
      --text: #f4f9ff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(18, 24, 29, 0.18), transparent 48%),
        var(--bg);
      padding: 3rem clamp(1rem, 3vw, 3rem);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(1.25rem, 2vw, 2.2rem);
      width: min(100%, 1500px);
      transform: translateY(-1.2rem);
    }

    .mark {
      position: relative;
      width: clamp(280px, 28vw, 520px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .ring {
      position: absolute;
      inset: 4% 6% 4% 6%;
      border-radius: 50%;
      border: 14px solid var(--ring);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .mark svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .wordmark {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      min-width: 0;
      color: var(--cyan);
      line-height: 0.9;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: clamp(2rem, 4vw, 5.8rem);
    }

    .wordmark .consulting {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-top: 1.3rem;
      font-size: clamp(1.4rem, 2.25vw, 3.2rem);
      letter-spacing: 0.38em;
      line-height: 1;
      white-space: nowrap;
    }

    .wordmark .consulting::before {
      content: "";
      display: inline-block;
      width: clamp(72px, 10vw, 150px);
      height: 3px;
      background: var(--cyan);
      border-radius: 999px;
      transform: translateY(-0.02em);
      opacity: 0.92;
    }

    @media (max-width: 920px) {
      .brand-lockup {
        flex-direction: column;
        gap: 0.8rem;
        transform: none;
      }

      .wordmark {
        align-items: center;
        text-align: center;
      }

      .wordmark .consulting {
        letter-spacing: 0.22em;
        gap: 0.75rem;
      }
    }

    @media (max-width: 560px) {
      .brand-lockup {
        gap: 0.4rem;
      }

      .wordmark {
        letter-spacing: 0.08em;
      }

      .wordmark .consulting {
        letter-spacing: 0.18em;
        gap: 0.6rem;
      }

      .wordmark .consulting::before {
        width: 46px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand-lockup" aria-label="Colebourn Consulting brand">
      <div class="mark" aria-hidden="true">
        <div class="ring"></div>
        <svg viewBox="0 0 500 500" role="img" aria-label="Colebourn Consulting mark">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M160 240 L240 120 L220 240 H310 L190 380 L210 260 H120 Z" fill="#29d9ff"/>
            <circle cx="290" cy="130" r="26" fill="#29d9ff"/>
            <circle cx="330" cy="350" r="26" fill="#29d9ff"/>
            <circle cx="165" cy="350" r="26" fill="#29d9ff"/>
          </g>
        </svg>
      </div>

      <div class="wordmark" aria-label="Colebourn Consulting">
        <div>COLEBOURN</div>
        <div class="consulting">CONSULTING</div>
      </div>
    </div>
  </div>
</body>
</html>
